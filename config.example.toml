# The main configuration file for the Gravity Connector sidecar.
# Some fields are optional and can be omitted, in which case the default value, if present, will be used.

# Unique id of this instance
instance_id = "LOCAL_DEV"

# Validator identity keypair used for relay and Jito authentication.
# When omitted, the connector accepts Agave's setIdentityFromBytes method on an
# owner-only IPC socket at <ledger_path>/gravity-admin/admin.rpc.
# https://jito-foundation.gitbook.io/mev/mev-payment-and-distribution/high-level
# OPTIONAL
# identity_path = "/path/to/identity.json"

# Validator identity that must be active before the connector contacts a relay.
# Required without identity_path. Set it when the keypair file may change; the
# connector waits until the file contains this identity. When omitted, it is
# derived from the keypair at startup.
# expected_identity = "<VALIDATOR_IDENTITY_PUBKEY>"

# Relay endpoints. Use tcp:// URLs with an explicit port. If multiple endpoints
# are available for a single region, add all of them for redundancy.
relay_addrs = ["tcp://relay.example.com:12000"]

# CPU core dedicated to the connector. This core is expected to run at or near
# 100% utilization for optimal performance.

# NOTE: make sure this core is not also assigned to other threads, eg POH or XDP in the validator
connector_core = 1

# Number of execution workers to run, these are unpinned and managed by the validator process
num_workers = 8

# Path to the validator ledger directory. The connector derives admin.rpc and
# scheduler_bindings.ipc from this directory.
ledger_path = "/path/to/ledger"

# Set this only when the validator overrides the cluster slot duration.
# slot_duration_override_ms = 450

# If true the relay will blacklist addresses on the OFAC sanctioned list
# OPTIONAL, DEFAULT: false
filter_ofac = false

# Address serving Prometheus metrics on /metrics and a JSON health summary on
# /health. Bind to a specific interface to limit exposure; on 0.0.0.0 firewall
# it to your scrapers.
# OPTIONAL, DEFAULT: 0.0.0.0:9093
metrics_addr = "0.0.0.0:9093"

# Webhook for critical alerts. Supported providers are "discord" and "slack".
# Set the URL inline, or use the format "env:ENV_KEY" to load it from the environment.
# OPTIONAL
# [alert_webhook]
# provider = "slack"
# url = "env:ALERT_WEBHOOK_URL"

# Legacy Discord configuration remains supported for backwards compatibility:
# discord_webhook = "env:DISCORD_WEBHOOK"

# Validator client configuration
#
# Configure exactly one client: [client.jito] for Jito-Solana or
# [client.agave] for regular Agave. The Jito-Solana configuration below is
# active; the alternative Agave configurations are commented out.

# Jito-Solana client
[client.jito]

# Jito block engines the connector subscribes to. Omit this field to use the
# built-in mainnet regions, or set a non-empty list to override them.

# NOTE: We strongly recommend omitting this field so the connector uses the built-in mainnet regions

# jito_block_engines = ["https://testnet.block-engine.jito.wtf"]

# Local Block Engine proxy address for Jito-Solana.
#
# When configuring Jito-Solana manually, see the command-line reference:
# https://jito-foundation.gitbook.io/mev/jito-solana/command-line-arguments
#
# Configure the validator with:
# --enable-scheduler-bindings
# --block-engine-url http://127.0.0.1:11226
# --disable-block-engine-autoconfig
#
# Use this connector proxy as the only block-engine URL for Jito-Solana. The
# connector connects to real Jito block engines internally, routes bundles and
# packets through the external scheduler while the relay is connected, and can
# forward block-engine traffic to the validator as a fallback when the relay is
# disconnected.
#
# The local proxy only implements enough auth for Jito-Solana's handshake; it
# does not validate bearer tokens on block-engine RPCs. Bind to localhost unless
# the network is otherwise trusted.
block_engine_proxy_addr = "127.0.0.1:11226"

# Static Jito-Solana shred receiver addresses. `shred_receivers` corresponds to
# Jito-Solana's `shred_receiver_addresses` (`--shred-receiver-address`), while
# `shred_retransmit_receivers` corresponds to
# `shred_retransmit_receiver_addresses` (`--shred-retransmit-receiver-address`).
# The connector overrides those validator settings through its admin RPC, so
# repeat here any addresses configured directly on the validator.
# Relay-provided addresses are appended to these lists.
shred_receivers = []
shred_retransmit_receivers = []

# Regular Agave client (alternative)
#
# Replace the entire [client.jito] block above with one of the following Agave
# configurations.

# Agave without Jito integration:
# [client.agave]

# Agave with connector-managed Jito integration and tip management:
# [client.agave]
# Jito block engines the connector subscribes to. Omit this field to use the
# built-in mainnet regions, or set a non-empty list to override them.

# NOTE: We strongly recommend omitting this field so the connector uses the built-in mainnet regions

# jito_block_engines = ["https://testnet.block-engine.jito.wtf"] # optional
# The tip-management values below are normally supplied as Jito-Solana
# command-line arguments. When using regular Agave, configure their
# corresponding values here instead:
# https://jito-foundation.gitbook.io/mev/jito-solana/command-line-arguments
# vote_account_pubkey = "11111111111111111111111111111111"
# RPC URL used to send Jito tip-management lifecycle transactions.
# rpc_url = "http://localhost:8899"
# API key appended to the RPC URL. Set it inline, or use "env:ENV_KEY" to load
# it from the environment. Optional.
# rpc_api_key = "env:RPC_API_KEY"
# mev_commission_bps = 800
# merkle_root_upload_authority = "8F4jGUmxF36vQ6yabnsxX6AQVXdKBhs8kGSUuRKSg8Xt"
# tip_distribution_program_pubkey = "4R3gSG8BpU4t19KYj8CfnbtRpnT8gtk4dvTHxVRwc2r7"
# tip_payment_program_pubkey = "T1pyyaTNZsKv2WcRAB8oVnk93mLJw2XzjtVYqCsaHqt"

# Configuration for stdout logs
# OPTIONAL
[logging.stdout]
# Whether to enable stdout logs
# OPTIONAL, DEFAULT: true
enabled = true
# Log level
# OPTIONAL, DEFAULT: info
level = "info"
# Whether to enable ANSI color codes
# OPTIONAL, DEFAULT: true
enable_ansi = true

# Configuration for file logs. Log files are in JSON format and rolling daily
# OPTIONAL
[logging.file]
# Whether to enable file logs
# OPTIONAL, DEFAULT: false
enabled = false
# Log level
# OPTIONAL, DEFAULT: info
level = "info"
# Max number of daily log files to retain before the oldest is deleted
# OPTIONAL, DEFAULT: 30
max_days = 30
# Directory to write log files to
# OPTIONAL, DEFAULT: ~/.local/share/gravity-connector/logs
dir = "/path/to/logs"
