name: "[CI] Lint and test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always


jobs:
  lint:
    name: Check compilation and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: extractions/setup-just@v2

      - uses: Swatinem/rust-cache@v2

      - name: Check compilation
        run: cargo check

      - name: Check formatting
        run: just fmt-check

      - name: Check clippy
        run: just clippy

      - name: Check Machete
        run: just machete

      - name: Check typos
        run: just typos

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: extractions/setup-just@v2

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: just test
