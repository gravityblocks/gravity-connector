name: "[Release] Cut tag and draft release"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to release (leave empty for HEAD)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Cut next tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target commit
        id: resolve
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          TARGET=$(git rev-parse --verify --end-of-options "${RELEASE_COMMIT:-HEAD}^{commit}")
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Read release tag from target manifest
        id: calc-next
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          NEXT_TAG=$(python3 .github/scripts/release-tag.py "$TARGET")
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $NEXT_TAG (at $TARGET)"

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.calc-next.outputs.next_tag }}" "${{ steps.resolve.outputs.target }}"
          git push origin "${{ steps.calc-next.outputs.next_tag }}"

      - name: Create draft GitHub Release
        if: ${{ !contains(steps.calc-next.outputs.next_tag, '-alpha.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.calc-next.outputs.next_tag }}
        run: gh release create "$TAG" --verify-tag --draft --generate-notes
